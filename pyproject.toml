[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realsync-dataset"
version = "0.1.0"
description = "Frozen RealSync manifests and reproducible audio-visual dataset tooling"
requires-python = ">=3.10,<3.12"
license = {text = "MIT (code); see DATA_LICENSE.md for metadata"}
dependencies = []

[project.optional-dependencies]
load = ["numpy==1.24.3"]
test = ["numpy==1.24.3"]
eval = ["numpy==1.24.3", "scikit-learn==1.3.0", "scipy==1.11.1", "joblib==1.2.0", "threadpoolctl==2.2.0"]

[project.scripts]
realsync = "realsync.cli:main"

[tool.setuptools.packages.find]
include = ["realsync*"]
